<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Estagiagros — vagas e estágios no agronegócio</title>
<style>
:root{--g:#2e7d32;--bg:#f4f7f2;--fg:#1c2a1c;--card:#fff;--bd:#d5dfd0}
@media(prefers-color-scheme:dark){:root{--bg:#121a12;--fg:#e6efe4;--card:#1b261b;--bd:#2f402f;--g:#66bb6a}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;padding:.75rem 1rem;background:var(--g);color:#fff}
header b{font-size:1.2rem}nav{display:flex;flex-wrap:wrap;gap:.25rem 1rem}
nav a{color:#fff;text-decoration:none;padding:.25rem 0}nav a:hover{text-decoration:underline}
main{max-width:760px;margin:0 auto;padding:1rem}
.card,form{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:1rem;margin:0 0 .75rem}
form{display:grid;gap:.6rem}form.inline{display:flex;flex-wrap:wrap;padding:.5rem}
label{display:grid;gap:.2rem;font-size:.9rem}
input,select,textarea{font:inherit;padding:.5rem;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:.5rem .9rem;border:0;border-radius:6px;background:var(--g);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--g);border:1px solid var(--g)}
.row{display:flex;justify-content:space-between;gap:.5rem;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--bd)}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;font-size:.85rem;opacity:.85;margin:.3rem 0}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem}
#toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:#222;color:#fff;padding:.6rem 1rem;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.bad{background:#b71c1c}
</style>
</head>
<body>
<header><b>🌱 Estagiagros</b><nav id="nav"></nav></header>
<main id="app"><p>Carregando…</p></main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
